<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shree Annapurna Rasoi – Pure Veg Family Restaurant, Hanuman Garhi, Ayodhya (Demo)</title>
<meta name="description" content="Pure veg family restaurant next to Hanuman Garhi exit gate, Ayodhya. Order or book a table on WhatsApp. Demo by Vyashika Digital.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Tiro+Devanagari+Hindi&display=swap">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Restaurant","name":"Shree Annapurna Rasoi","servesCuisine":"Vegetarian","address":{"@type":"PostalAddress","streetAddress":"VIP Gate, near Hanuman Garhi Temple, Sai Nagar","addressLocality":"Ayodhya","addressRegion":"Uttar Pradesh","postalCode":"224123","addressCountry":"IN"},"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","reviewCount":"255"}}</script>
<style>
:root{--bg:#f5f6f1;--card:#fff;--ink:#1d2a24;--mute:#58655e;--leaf:#1f5a3f;--saf:#e8a317;--line:#dfe3da;--steel:#cfd5d2;--steel2:#aeb7b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121915;--card:#1b2520;--ink:#eef2ee;--mute:#a3b0a8;--leaf:#5fbf8f;--line:#2b382f;--steel:#8c9692;--steel2:#6d7773}}
:root[data-theme="dark"]{--bg:#121915;--card:#1b2520;--ink:#eef2ee;--mute:#a3b0a8;--leaf:#5fbf8f;--line:#2b382f;--steel:#8c9692;--steel2:#6d7773}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:"Tiro Devanagari Hindi",Georgia,serif;font-weight:400;line-height:1.2;margin:0}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.demo{background:var(--leaf);color:#fff;font-size:14px;text-align:center;padding:8px 12px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
header b{font-family:"Tiro Devanagari Hindi",Georgia,serif;font-weight:400;font-size:20px}
.lang button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;cursor:pointer}
.lang button:first-child{border-radius:99px 0 0 99px}.lang button:last-child{border-radius:0 99px 99px 0;border-left:0}
.lang button[aria-pressed=true]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.hero{display:grid;gap:28px;padding:20px 0 36px;align-items:center}
.hero h1{font-size:clamp(34px,8vw,54px)}
.hero p{color:var(--mute);margin:12px 0 0}
.thali{width:min(78vw,300px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9edea,var(--steel) 55%,var(--steel2));position:relative;box-shadow:0 14px 30px #0003,inset 0 0 0 8px #ffffff55}
.thali i{position:absolute;width:27%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 3px 8px #0005,0 0 0 4px #ffffff66}
.thali i:nth-child(1){left:14%;top:14%;background:#c8791c}.thali i:nth-child(2){right:14%;top:14%;background:#d9b13a}
.thali i:nth-child(3){left:36.5%;top:36.5%;background:#6e8f3c}.thali i:nth-child(4){left:14%;bottom:14%;background:#a8431f}
.thali i:nth-child(5){right:14%;bottom:14%;background:#f1ead4}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;border:2px solid var(--leaf);color:var(--leaf);background:transparent;cursor:pointer;font-family:inherit;font-size:16px}
.btn.p{background:var(--leaf);color:#fff}
.btn:focus-visible,.lang button:focus-visible,input:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
.facts{display:grid;gap:0;border-top:2px solid var(--leaf);margin:0 0 8px}
.facts div{padding:14px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-weight:600}.facts span{color:var(--mute)}
section{padding:30px 0}
h2{font-size:28px;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 16px}
.menu{list-style:none;margin:0;padding:0}
.menu li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.menu .n{flex:1}.menu .pr{font-weight:600;min-width:48px;text-align:right}
.menu a{font-size:14px;font-weight:600;color:var(--leaf);white-space:nowrap}
.rate{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rate big{font-family:"Tiro Devanagari Hindi",Georgia,serif;font-size:56px;line-height:1;color:var(--saf)}
form{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:grid;gap:4px;font-size:15px;color:var(--mute)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{border-top:1px solid var(--line);padding:22px 0 96px;font-size:14px;color:var(--mute)}
.menu li.cat{display:block;font-family:"Tiro Devanagari Hindi",Georgia,serif;font-size:20px;color:var(--leaf);padding:22px 0 6px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--leaf);background:transparent;color:var(--leaf);font-size:20px;line-height:1;cursor:pointer}
.q button:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
.q span{min-width:18px;text-align:center;font-weight:600}
.cart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:22px;display:grid;gap:12px}
.cart ul{list-style:none;margin:0;padding:0}.cart li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:18px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
.bar .btn{flex:1;text-align:center;padding:11px 8px}
.badge{margin-top:14px;font-size:15px;color:var(--mute)}.badge b{color:var(--saf);font-weight:600}
@media(min-width:700px){.hero{grid-template-columns:1.2fr 1fr}}
</style>
</head>
<body>
<div class="demo"><span data-en="Demo website by Vyashika Digital – not the official site" data-hi="Vyashika Digital द्वारा बनाई गई डेमो वेबसाइट – ऑफ़िशियल साइट नहीं"></span></div>
<div class="wrap">
<header><b>अन्नपूर्णा रसोई</b><div class="lang"><button type="button" data-l="en" aria-pressed="false">EN</button><button type="button" data-l="hi" aria-pressed="true">हिं</button></div></header>

<div class="hero">
<div>
<h1 data-en="Pure veg thali, steps from Hanuman Garhi" data-hi="हनुमानगढ़ी के पास शुद्ध शाकाहारी थाली"></h1>
<p data-en="Shree Annapurna Rasoi is a family restaurant at the Hanuman Garhi exit gate. Order or book a table on WhatsApp in a minute." data-hi="श्री अन्नपूर्णा रसोई, हनुमानगढ़ी निकास द्वार पर फैमिली रेस्टोरेंट। WhatsApp पर एक मिनट में ऑर्डर करें या टेबल बुक करें।"></p>
<div class="btns"><a class="btn p" href="#menu" data-en="Order food" data-hi="खाना ऑर्डर करें"></a><a class="btn" href="#book" data-en="Book a table" data-hi="टेबल बुक करें"></a></div>
<div class="badge">★ <b>4.9</b> <span data-en="on Google · 255 reviews" data-hi="Google पर · 255 रिव्यू"></span></div>
</div>
<div class="thali" role="img" aria-label="Steel thali with five katoris"><i></i><i></i><i></i><i></i><i></i></div>
</div>

<div class="facts">
<div><b data-en="Special thali" data-hi="स्पेशल थाली"></b><span data-en="Guests say it tastes like a home-cooked meal." data-hi="मेहमान कहते हैं स्वाद घर के खाने जैसा है।"></span></div>
<div><b data-en="Air-conditioned family hall" data-hi="एसी फैमिली हॉल"></b><span data-en="A cool place to sit after darshan." data-hi="दर्शन के बाद आराम से बैठने की ठंडी जगह।"></span></div>
<div><b data-en="Open until 11:30 pm" data-hi="रात 11:30 बजे तक खुला"></b><span data-en="Veg-only kitchen." data-hi="केवल शाकाहारी रसोई।"></span></div>
</div>

<section id="menu">
<h2 data-en="Menu" data-hi="मेन्यू"></h2>
<p class="sub" data-en="Sample items for this demo. The full menu will be added." data-hi="डेमो के लिए कुछ आइटम। पूरा मेन्यू जोड़ा जाएगा।"></p>
<ul class="menu" id="ml"></ul>
<div class="cart" id="cart"><h3 style="font-size:22px" data-en="Your order" data-hi="आपका ऑर्डर"></h3><ul id="cl"></ul><div class="tot"><span data-en="Total (priced items)" data-hi="कुल (कीमत वाले आइटम)"></span><span id="ct">₹0</span></div><label><span data-en="Order type" data-hi="ऑर्डर का तरीका"></span><select id="ot"><option>Dine-in</option><option>Takeaway</option><option>Home delivery</option></select></label><label><span data-en="Your name" data-hi="आपका नाम"></span><input id="on" autocomplete="name"></label><a class="btn p" id="ok" target="_blank" rel="noopener" href="#" style="text-align:center" data-en="Send order on WhatsApp" data-hi="WhatsApp पर ऑर्डर भेजें"></a></div>
</section>

<section>
<h2 data-en="What guests say" data-hi="मेहमान क्या कहते हैं"></h2>
<div class="rate"><big>4.9</big><span data-en="on Google, from 255 reviews" data-hi="Google पर, 255 रिव्यू से"></span></div>
<div class="btns"><a class="btn" href="https://maps.app.goo.gl/K5grNsyKpiPGBhEu7" target="_blank" rel="noopener" data-en="Read reviews on Google" data-hi="Google पर रिव्यू पढ़ें"></a></div>
</section>

<section id="book">
<h2 data-en="Book a table" data-hi="टेबल बुक करें"></h2>
<p class="sub" data-en="Fill in the details, then tap the button. We confirm on WhatsApp." data-hi="जानकारी भरें और बटन दबाएँ। हम WhatsApp पर कन्फर्म करेंगे।"></p>
<form onsubmit="return false">
<label><span data-en="Name" data-hi="नाम"></span><input id="bn" autocomplete="name"></label>
<div class="two"><label><span data-en="Date" data-hi="तारीख़"></span><input id="bd" type="date"></label><label><span data-en="Time" data-hi="समय"></span><input id="bt" type="time"></label></div>
<label><span data-en="Guests" data-hi="कितने लोग"></span><input id="bg" type="number" min="1" value="4"></label>
<a class="btn p" id="bk" target="_blank" rel="noopener" href="#" data-en="Send booking on WhatsApp" data-hi="WhatsApp पर बुकिंग भेजें" style="text-align:center"></a>
</form>
</section>

<section>
<h2 data-en="Find us" data-hi="हमें यहाँ पाएँ"></h2>
<p class="sub" data-en="VIP Gate, near Hanuman Garhi Temple, Sai Nagar, Ayodhya, Uttar Pradesh 224123" data-hi="वीआईपी गेट, हनुमानगढ़ी मंदिर के पास, साईं नगर, अयोध्या, उत्तर प्रदेश 224123"></p>
<div class="btns"><a class="btn p" href="https://maps.app.goo.gl/K5grNsyKpiPGBhEu7" target="_blank" rel="noopener" data-en="Get directions" data-hi="रास्ता देखें"></a><a class="btn" href="https://wa.me/?text=Namaste" target="_blank" rel="noopener" data-en="Chat on WhatsApp" data-hi="WhatsApp पर चैट करें"></a></div>
</section>

<footer><span data-en="Demo built by Vyashika Digital. Photos, full menu and the restaurant's own WhatsApp number will be added in the final site." data-hi="डेमो Vyashika Digital ने बनाया है। फ़ाइनल साइट में फ़ोटो, पूरा मेन्यू और रेस्टोरेंट का अपना WhatsApp नंबर जोड़ा जाएगा।"></span></footer>
</div>

<div class="bar"><a class="btn p" href="#cart" data-en="Order food" data-hi="खाना ऑर्डर करें"></a><a class="btn" href="#book" data-en="Book a table" data-hi="टेबल बुक करें"></a></div>
<script>
var L="hi",Q={},C=["Thali & rice|थाली और चावल","Breads|रोटी और ब्रेड"],M=[[0,"Special Thali","स्पेशल थाली",""],[0,"Veg Biryani with Raita","वेज बिरयानी रायते के साथ",""],[0,"Paneer Biryani with Raita","पनीर बिरयानी रायते के साथ",""],[0,"Dal Khichdi","दाल खिचड़ी",""],[1,"Tandoori Roti","तंदूरी रोटी","15"],[1,"Lacha Paratha","लच्छा परांठा","50"],[1,"Butter Naan","बटर नान","50"],[1,"Garlic Naan","गार्लिक नान","60"],[1,"Stuff Kulcha","स्टफ कुल्चा","70"]];
function qty(i,d){Q[i]=Math.max(0,(Q[i]||0)+d);draw()}
function ord(){var g=function(i){return document.getElementById(i).value},t=(window.OL||[]).length?window.OL.join("\n"):"(no items selected)";document.getElementById("ok").href=wa("Order ("+g("ot")+")\nName: "+g("on")+"\n"+t+"\nTotal (priced items): ₹"+(window.OT||0))}
function wa(t){return "https://wa.me/?text="+encodeURIComponent(t)}
function draw(){
document.documentElement.lang=L;
document.querySelectorAll("[data-en]").forEach(function(e){e.textContent=e.getAttribute("data-"+L)});
document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===L)});
var h="",c=-1,tot=0,ls="",lines=[];
M.forEach(function(m,i){if(m[0]!==c){c=m[0];h+='<li class="cat">'+C[c].split("|")[L==="hi"?1:0]+'</li>'}
var q=Q[i]||0,nm=L==="hi"?m[2]:m[1];
h+='<li><span class="n">'+nm+'</span><span class="pr">'+(m[3]?"₹"+m[3]:"")+'</span><span class="q"><button type="button" aria-label="Remove one" onclick="qty('+i+',-1)">−</button><span>'+q+'</span><button type="button" aria-label="Add one" onclick="qty('+i+',1)">+</button></span></li>';
if(q){tot+=q*(+m[3]||0);ls+='<li><span>'+q+' × '+nm+'</span><span>'+(m[3]?"₹"+q*m[3]:"")+'</span></li>';lines.push(q+" x "+m[1])}});
document.getElementById("ml").innerHTML=h;
document.getElementById("cl").innerHTML=ls||'<li style="color:var(--mute)">'+(L==="hi"?"मेन्यू से आइटम जोड़ें।":"Add items from the menu.")+'</li>';
document.getElementById("ct").textContent="₹"+tot;window.OL=lines;window.OT=tot;ord();
bk()}
function bk(){var g=function(i){return document.getElementById(i).value};
document.getElementById("bk").href=wa("Table booking\nName: "+g("bn")+"\nDate: "+g("bd")+"\nTime: "+g("bt")+"\nGuests: "+g("bg"))}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){L=b.dataset.l;draw()}});
document.querySelectorAll("form input").forEach(function(i){i.oninput=bk});
document.getElementById("on").oninput=ord;document.getElementById("ot").onchange=ord;
draw();
</script>
</body>
</html>
